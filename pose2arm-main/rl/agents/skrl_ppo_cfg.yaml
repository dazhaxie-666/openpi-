seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 0.2
    initial_log_std: -1.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 256, 128]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1   # auto (rollouts * num_envs)

agent:
  class: PPO
  rollouts: 64
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 5.0e-5
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.001
  value_loss_scale: 1.0
  kl_threshold: 0.008
  time_limit_bootstrap: True
  experiment:
    directory: "openarm_retarget"
    experiment_name: ""
    write_interval: 500
    checkpoint_interval: 50000

trainer:
  class: SequentialTrainer
  timesteps: 10000000
  environment_info: "log"
